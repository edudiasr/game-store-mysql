name: build

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GAMESTORE_TEST_MYSQL: "Server=127.0.0.1;Port=3306;User ID=root;Password=root"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build GameStore.slnx -c Release
      - run: dotnet test --solution GameStore.slnx -c Release --no-build
